<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>申請取消の試作</title>
<style>body{font:16px system-ui;max-width:840px;margin:40px auto;padding:20px;color:#182638;background:#f6f8fb}section{background:white;padding:24px;margin:18px 0;border:1px solid #dde3eb;border-radius:12px}button,select{font:inherit;padding:10px;margin:5px;border:1px solid #ccd5e1;border-radius:6px}button{cursor:pointer;background:#eef4ff;color:#184ba0}dt{color:#58677b}dd{margin:4px 0 16px;font-weight:600}.tabs button[aria-selected=true]{background:#184ba0;color:white}output{display:block;padding:12px;background:#eef4ff}small{color:#58677b}</style>
<h1>申請を取り消せる条件を確かめる</h1><p>使い捨ての試作・架空データ。操作する人と申請者がともに空でない本人で、申請中のときだけ取り消せるかを確かめます。</p><small>仮置き：1件＝1申請。取消後は「取り消し済み」。保存せず、再読み込みで初期化します。</small>
<section><h2>現在の申請（架空の1件）</h2><dl><dt>操作する人</dt><dd id="actorValue"></dd><dt>申請者</dt><dd id="ownerValue"></dd><dt>申請の状態</dt><dd id="statusValue"></dd></dl><output id="result" aria-live="polite">条件を選んで取り消してください。</output></section>
<section><h2>自由に試す</h2><label>操作する人<select id="actor"><option>alice</option><option>bob</option><option value="">空</option></select></label><label>申請者<select id="owner"><option>alice</option><option>bob</option><option value="">空</option></select></label><label>申請の状態<select id="status"><option>申請中</option><option>承認済み</option><option>取り消し済み</option></select></label><p><button id="apply">選んだ条件でやり直す</button><button id="cancel">取り消す</button></p></section>
<section><h2>順に確かめる</h2><div class="tabs" role="tablist" id="tabs"></div><p id="description"></p><button id="step"></button></section>
<script id="logic">
function cancelRequest(state) {
  if (!state.actor || !state.owner) return { state: {...state}, allowed: false, message: '拒否：操作する人と申請者の両方が必要です。' };
  if (state.actor !== state.owner) return { state: {...state}, allowed: false, message: '拒否：申請者本人だけが取り消せます。' };
  if (state.status !== '申請中') return { state: {...state}, allowed: false, message: '拒否：申請中の申請だけが対象です。' };
  return {state: {...state, status: '取り消し済み'}, allowed: true, message: '取り消しました。申請は取り消し済みです。'};
}
</script>
<script>
const el=id=>document.getElementById(id);
let state={actor:'alice',owner:'alice',status:'申請中'}, stepIndex=0, active=0;
const scenarios=[
 {title:'本人',actor:'alice',owner:'alice',status:'申請中',description:'本人が申請中の1件を取り消し、もう一度取り消すと拒否されます。'},
 {title:'承認済み',actor:'alice',owner:'alice',status:'承認済み',description:'本人でも承認済みなら拒否され、状態が変わりません。'},
 {title:'他人',actor:'bob',owner:'alice',status:'申請中',description:'別の人が操作すると拒否されます。'},
 {title:'操作する人が空',actor:'',owner:'alice',status:'申請中',description:'操作する人が空なら拒否されます。'},
 {title:'申請者が空',actor:'alice',owner:'',status:'申請中',description:'申請者が空なら拒否されます。'},
 {title:'両方が空',actor:'',owner:'',status:'申請中',description:'空同士が一致しても本人として扱わず拒否されます。'}
];
function render(message){for(const field of ['actor','owner','status']){el(field+'Value').textContent=state[field]||'空';el(field).value=state[field];}if(message)el('result').textContent=message;}
function cancel(){const result=cancelRequest(state);state=result.state;render(result.message);}
function selectScenario(i){active=i;stepIndex=0;const s=scenarios[i];state={actor:s.actor,owner:s.owner,status:s.status};render('シナリオの条件に戻しました。');el('description').textContent=s.description;el('step').textContent='1. 取り消して結果を見る';[...el('tabs').children].forEach((b,j)=>b.setAttribute('aria-selected',String(i===j)));}
scenarios.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s.title;b.setAttribute('role','tab');b.onclick=()=>selectScenario(i);el('tabs').append(b);});
el('apply').onclick=()=>{state={actor:el('actor').value,owner:el('owner').value,status:el('status').value};render('選んだ条件でやり直しました。');};el('cancel').onclick=cancel;
el('step').onclick=()=>{if(stepIndex===2){selectScenario(active);return;}cancel();stepIndex++;el('step').textContent=stepIndex===1?'2. もう一度取り消す':'最初から試す';};
selectScenario(0);
</script></html>
